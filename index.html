<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Data Analysis</title>
<style>
  body { font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; background: #f5f7fa; color: #1f2933; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 16px; margin: 14px 0; }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: .95rem; }
  button:disabled { background: #9db4e8; cursor: wait; }
  button.rec { background: #dc2626; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #c3ccd6; border-radius: 6px; font-size: 1rem; margin-bottom: 8px; }
  select { padding: 7px; border-radius: 6px; border: 1px solid #c3ccd6; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .muted { color: #6b7785; font-size: .9rem; }
  #status { margin: 8px 0; min-height: 1.2em; }
  #status.error { color: #b91c1c; }
  pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #dde3ea; padding: 6px 10px; text-align: start; }
  th { background: #eef2f7; }
  label { font-weight: 600; font-size: .9rem; }
</style>
</head>
<body>
<h1>Voice Data Analysis</h1>
<div class="muted">Upload a dataset, then ask a question by text or voice (Arabic or English).</div>

<div class="card">
  <h2>1. Dataset</h2>
  <input type="file" id="dataFile" accept=".csv,.xlsx,.xls">
  <div class="row"><button id="uploadBtn">Upload</button><span id="dataInfo" class="muted"></span></div>
</div>

<div class="card">
  <h2>2. Ask</h2>
  <input type="text" id="question" dir="auto" placeholder="Show me total sales by product category">
  <div class="row">
    <button id="askBtn">Ask</button>
    <button id="recBtn">&#127908; Record</button>
    <select id="lang" title="Voice language">
      <option value="">Auto language</option>
      <option value="en">English</option>
      <option value="ar">Arabic</option>
    </select>
  </div>
  <div class="row"><span class="muted">or upload audio:</span><input type="file" id="audioFile" accept="audio/*"><button id="audioBtn">Send audio</button></div>
</div>

<div id="status" class="muted"></div>

<div class="card" id="result" hidden>
  <div id="transcriptRow"><label>What I heard</label><div id="transcript" dir="auto"></div></div>
  <label>SQL</label><pre id="sql"></pre>
  <label>Result</label><div class="scroll"><table id="table"></table></div>
  <p><label>Explanation</label></p><div id="explanation" dir="auto"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const buttons = ["uploadBtn", "askBtn", "recBtn", "audioBtn"];

function setStatus(text, isError) {
  $("status").textContent = text || "";
  $("status").className = isError ? "error" : "muted";
}
function busy(on) { buttons.forEach(b => { $(b).disabled = on; }); }

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : JSON.stringify(d || data));
  }
  return data;
}

async function run(message, job) {
  busy(true); setStatus(message);
  try { await job(); setStatus(""); }
  catch (e) { setStatus(e.message, true); }
  finally { busy(false); }
}

function showResult(r) {
  $("result").hidden = false;
  $("transcriptRow").hidden = !r.transcript;
  $("transcript").textContent = r.transcript || "";
  $("sql").textContent = r.sql;
  $("explanation").textContent = r.explanation;
  const table = $("table");
  table.innerHTML = "";
  const head = table.insertRow();
  r.columns.forEach(c => { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); });
  r.rows.forEach(row => {
    const tr = table.insertRow();
    row.forEach(v => { tr.insertCell().textContent = v === null ? "" : v; });
  });
}

function sendAudio(blob, name) {
  const form = new FormData();
  form.append("file", blob, name);
  const lang = $("lang").value;
  const url = "/ask-voice" + (lang ? "?language=" + lang : "");
  return run("Listening and analysing... (the first voice request is slow)", async () => {
    showResult(await api(url, { method: "POST", body: form }));
  });
}

$("uploadBtn").onclick = () => {
  const file = $("dataFile").files[0];
  if (!file) return setStatus("Choose a CSV or Excel file first.", true);
  const form = new FormData();
  form.append("file", file);
  run("Uploading...", async () => {
    const info = await api("/dataset", { method: "POST", body: form });
    $("dataInfo").textContent = info.table + ": " + info.rows + " rows, columns: " + info.columns.join(", ");
  });
};

$("askBtn").onclick = () => {
  const question = $("question").value.trim();
  if (!question) return setStatus("Type a question first.", true);
  run("Analysing...", async () => {
    showResult(await api("/ask-text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    }));
  });
};

$("audioBtn").onclick = () => {
  const file = $("audioFile").files[0];
  if (!file) return setStatus("Choose an audio file first.", true);
  sendAudio(file, file.name);
};

let recorder = null, chunks = [];
$("recBtn").onclick = async () => {
  if (recorder) { recorder.stop(); return; }   // second click = stop
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const type = recorder.mimeType || "audio/webm";
      const ext = type.includes("mp4") ? "mp4" : type.includes("ogg") ? "ogg" : "webm";
      recorder = null;
      $("recBtn").textContent = "\uD83C\uDFA4 Record";
      $("recBtn").classList.remove("rec");
      sendAudio(new Blob(chunks, { type }), "recording." + ext);
    };
    recorder.start();
    $("recBtn").textContent = "\u25A0 Stop";
    $("recBtn").classList.add("rec");
    setStatus("Recording... click Stop when you finish.");
  } catch (e) {
    setStatus("Microphone not available: " + e.message, true);
  }
};
</script>
</body>
</html>
